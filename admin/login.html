<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Device Monitoring Portal</title>
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <h1 class="login-title">Administrator Portal</h1>
        <p class="login-subtitle">Sign in to manage remote monitoring and live streams</p>
      </div>

      <form id="loginForm" class="login-form">
        <div id="loginAlert" class="login-alert error" role="alert"></div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" class="form-input" autocomplete="username" required autofocus placeholder="Enter admin username">
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-input" autocomplete="current-password" required placeholder="Enter admin password">
        </div>

        <button type="submit" id="submitBtn" class="btn-admin btn-admin-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Sign In
        </button>
      </form>

      <div style="margin-top: 24px; text-align: center; font-size: 12px; color: var(--admin-text-dim);">
        Protected by HTTP-only signed sessions and rate-limiting.
      </div>
    </div>
  </div>

  <script src="/js/admin-login.js"></script>
</body>
</html>
